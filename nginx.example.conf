# Пример конфига Angie/nginx перед IPTV-прокси: TLS снимается здесь, сам
# прокси слушает обычный HTTP на 127.0.0.1:5000.
#
# Что должно быть настроено на стороне прокси:
#   .env:       IPTV_PROXY_PORT=5000, IPTV_PROXY_HOST_NAME=iptv.test.com,
#               IPTV_PROXY_BIND=127.0.0.1 (порт опубликован только на
#               localhost, иначе к прокси можно прийти в обход этого сервера
#               и подделать X-Forwarded-For)
#   config.py:  trust_x_forwarded_for = True (иначе все клиенты видны
#               с 127.0.0.1 и блокировка перебора пароля бьёт по всем)

upstream iptv_proxy {
    server 127.0.0.1:5000;
    # Держим соединения к прокси открытыми: плеер запрашивает сегмент
    # каждые несколько секунд, без keepalive на каждый - новое TCP-соединение.
    keepalive 16;
}

server {
    # http оставлен намеренно: старые Smart TV и приставки часто не
    # справляются с современными сертификатами - потоки отдаём по обоим.
    listen 80;
    listen [::]:80;

    listen 443 ssl;
    listen [::]:443 ssl;

    server_name iptv.test.com;

    acme astropages;

    ssl_certificate     $acme_cert_astropages;
    ssl_certificate_key $acme_cert_key_astropages;

    # Отсекает сканеры. Если какой-то совсем старый плеер/приставка вдруг
    # получает обрыв соединения без ответа - причина может быть здесь.
    if ($server_protocol ~* "HTTP/1.0") {
        return 444;
    }

    add_header X-Robots-Tag "noindex, nofollow" always;

    # Списки каналов (M3U) бывают по сотне-другой КБ - сжимаем, если клиент
    # это поддерживает. Сегменты (.ts/.m4s) уже сжаты, их не трогаем.
    gzip on;
    gzip_types audio/x-mpegurl application/vnd.apple.mpegurl;

    # Все proxy_set_header - здесь, на уровне server: location наследует их,
    # только пока не объявит ни одного своего proxy_set_header.
    proxy_http_version  1.1;
    proxy_set_header    Connection          "";
    # Host и X-Forwarded-Proto прокси использует для ссылок в плейлисте
    # (при trust_x_forwarded_for = True). Если nginx слушает нестандартный
    # порт - Host $http_host: $host порт отбрасывает.
    proxy_set_header    Host                $host;
    proxy_set_header    X-Real-IP           $remote_addr;
    proxy_set_header    X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto   $scheme;
    proxy_headers_hash_max_size     512;
    proxy_headers_hash_bucket_size  128;

    # Сегменты отдаём клиенту по мере получения от провайдера, без
    # накопления в буферах/временных файлах (меньше задержка live).
    proxy_buffering off;
    # Должен быть не меньше read_timeout прокси (30 с в config.py).
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://iptv_proxy;
    }

    # Панель управления - только по https: Basic Auth по http передаёт
    # пароль открытым текстом. Путь должен совпадать с ADMIN_PATH из .env.
    location /admin/ {
        if ($scheme = http) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://iptv_proxy;
    }
}
